# deploy.yml — GitHub Actions CI/CD pipeline for Transfer Scout
# runs automatically when you push to main branch

name: Deploy Transfer Scout

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # step 1 — checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # step 2 — SSH into AWS and deploy
      - name: Deploy to AWS
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.AWS_HOST }}           # same server as PitchIQ
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}         # same key as PitchIQ
          script: |
            cd ~/transfer-scout
            git pull origin main
            docker-compose down
            docker-compose up --build -d
            echo "Transfer Scout deployed successfully!"